<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZeSt CRM — управление заказами</title>
<style>
  :root { --red:#ff6a00; --red2:#ff8f3e; --bg:#0f0f13; --card:#1b1b21; --line:rgba(255,255,255,.1); --txt:#f2f2f6; --mut:#8e8e99; --ok:#2fbf71; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,sans-serif; padding:16px 14px 40px; }
  h1 { font-size:20px; margin:6px 0 2px; }
  .sub { color:var(--mut); font-size:12px; margin-bottom:14px; }
  .setup { background:var(--card); border-radius:14px; padding:14px; margin-bottom:14px; }
  .setup label { font-size:12px; color:var(--mut); display:block; margin:10px 0 4px; }
  input, select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#14141a; color:var(--txt); font-size:14px; }
  button { padding:10px 14px; border-radius:10px; border:0; background:var(--red); color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
  button:active { transform:scale(.97); }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  .top { display:flex; gap:8px; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .stats { display:flex; gap:8px; margin:12px 0; }
  .stat { flex:1; background:var(--card); border-radius:12px; padding:10px; text-align:center; }
  .stat b { display:block; font-size:17px; color:var(--red2); }
  .stat span { font-size:11px; color:var(--mut); }
  .order { background:var(--card); border-radius:14px; padding:12px; margin-top:10px; }
  .order .r1 { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .order .id { font-weight:800; font-size:15px; }
  .pill { font-size:11px; font-weight:800; padding:4px 10px; border-radius:8px; background:var(--line); }
  .p-accepted { background:#ffc72833; color:#ffc728; }
  .p-assembling { background:#ff6a0033; color:#ff8f3e; }
  .p-transit { background:#7c2ae844; color:#c9b4ff; }
  .p-delivered { background:#2fbf7133; color:#2fbf71; }
  .p-cancelled { background:#ffffff14; color:#8e8e99; }
  .meta { color:var(--mut); font-size:12px; margin-top:6px; line-height:1.5; }
  .btns { display:flex; gap:6px; margin-top:10px; }
  .btns button { flex:1; font-size:12.5px; padding:9px 4px; }
  .btns .done { background:var(--ok); }
  .btns .cancel { background:#2a2a33; color:#8e8e99; }
  .empty { text-align:center; color:var(--mut); padding:40px 0; }
  .hint { color:var(--mut); font-size:11px; margin-top:16px; line-height:1.6; text-align:center; }
  .refresh { display:flex; align-items:center; gap:8px; }
  .refresh span { font-size:11px; color:var(--mut); }
</style>
</head>
<body>
  <div id="setup" class="setup">
    <b>Настройка (один раз)</b>
    <label>URL веб-приложения (заканчивается на /exec)</label>
    <input id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" />
    <label>PIN-код входа (придумайте)</label>
    <input id="cfgPin" placeholder="например 1477" />
    <div style="margin-top:12px"><button onclick="saveSetup()">Сохранить и открыть</button></div>
  </div>

  <div id="app" style="display:none">
    <div class="top">
      <div><h1>ZeSt CRM</h1><div class="sub">Управление заказами</div></div>
      <div class="refresh"><button class="ghost" onclick="load()">Обновить</button><span id="upd">—</span></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stToday">0</b><span>сегодня</span></div>
      <div class="stat"><b id="stRev">0 ₽</b><span>выручка</span></div>
      <div class="stat"><b id="stAll">0</b><span>всего</span></div>
    </div>
    <div id="list"></div>
    <div class="hint">Статусы из этой страницы видит клиент в приложении.<br>Страница работает на любом телефоне и компе — сохраните ссылку на неё в закладки.</div>
  </div>

<script>
const FLOW = ['accepted','assembling','transit','delivered'];
const NAMES = { accepted:'Принят', assembling:'Собираем', transit:'В пути', delivered:'Доставлен', cancelled:'Отменён' };
let ORDERS = [];
let PIN = localStorage.getItem('zest_crm_pin') || '';

function setupVisible() {
  return !localStorage.getItem('zest_crm_url') || !PIN;
}
function show() {
  const need = setupVisible();
  document.getElementById('setup').style.display = need ? 'block' : 'none';
  document.getElementById('app').style.display = need ? 'none' : 'block';
  if (!need) load();
}
function saveSetup() {
  const url = document.getElementById('cfgUrl').value.trim();
  const pin = document.getElementById('cfgPin').value.trim();
  if (!url || !pin) { alert('Заполните оба поля'); return; }
  localStorage.setItem('zest_crm_url', url);
  localStorage.setItem('zest_crm_pin', pin);
  PIN = pin;
  show();
}
async function api(body) {
  const url = localStorage.getItem('zest_crm_url');
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  return res.json();
}
async function load() {
  const url = localStorage.getItem('zest_crm_url');
  if (!url) return;
  const data = await fetch(url + '?action=orders&t=' + Date.now()).then(r => r.json()).catch(() => null);
  if (!data) return;
  ORDERS = (data.orders || []).map(o => ({
    id: o.id, time: o['время'], customer: o['клиент'], phone: o['телефон'],
    address: o['адрес'], slot: o['слот'], items: o['состав'],
    total: o['сумма'], payment: o['оплата'], status: o['статус'], device: o['device'],
  }));
  render();
  document.getElementById('upd').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU');
}
async function setStatus(id, status) {
  if (PIN && !confirm('PIN: ' + PIN + ' — верно? Нажмите ОК')) return;
  await api({ action: 'status', orderId: id, status });
  load();
}
function render() {
  const list = document.getElementById('list');
  const today = new Date().toDateString();
  const t = ORDERS.filter(o => new Date(o.time).toDateString() === today);
  document.getElementById('stToday').textContent = t.length;
  const rev = t.reduce((s, o) => s + (parseFloat(String(o.total).replace(',','.')) || 0), 0);
  document.getElementById('stRev').textContent = Math.round(rev) + ' ₽';
  document.getElementById('stAll').textContent = ORDERS.length;
  list.innerHTML = ORDERS.map((o, i) => {
    const idx = FLOW.indexOf(o.status);
    let btns = '';
    const next = idx >= 0 && idx < FLOW.length - 1 ? FLOW[idx + 1] : null;
    if (next) btns += `<button onclick="setStatus('${o.id}','${next}')">→ ${NAMES[next]}</button>`;
    if (o.status !== 'delivered' && o.status !== 'cancelled') btns += `<button class="cancel" onclick="setStatus('${o.id}','cancelled')">Отменён</button>`;
    return `<div class="order">
      <div class="r1"><span class="id">№ ${o.id}</span><span class="pill p-${o.status}">${NAMES[o.status] || o.status}</span></div>
      <div class="meta">${o.customer || '—'} · ${o.phone || '—'}</div>
      <div class="meta">${o.address || ''}</div>
      <div class="meta">${o.items || ''}</div>
      <div class="meta"><b>${o.total} ₽</b> · ${o.payment || ''} · ${o.slot || ''}</div>
      <div class="btns">${btns}</div>
    </div>`;
  }).join('') || '<div class="empty">Заказов пока нет</div>';
}
show();
load();
setInterval(() => { if (document.visibilityState === 'visible') load(); }, 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
</script>
</body>
</html>
